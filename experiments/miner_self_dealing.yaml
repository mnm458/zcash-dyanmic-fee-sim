name: miner_self_dealing

num_blocks: 500
random_seed: 42

chain:
  block_action_cap: 1000
  block_byte_cap: 2000000

zip317:
  marginal_fee: 5000

controller:
  type: ComparableMedianController
  lookback: 50
  reorg_buffer: 5
  oracle: action_weighted_median
  oracle_include_synthetic: true
  quantization: power_of_10
  base_fee: 5000
  floor_fee: 5000

block_builder:
  mode: highest_fee_per_action

synthetic:
  enabled: true
  actions_per_block: 100
  fee_per_action: 5000
  granularity_mode: granular
  tx_granularity_actions: 1

honest_demand:
  arrival_rate: 30
  mean_actions: 3
  expiry_blocks: 40

attacker:
  enabled: true
  type: MinerSelfDealingAttacker
  start_height: 100
  end_height: 200
  actions_per_block: 200
  target_fee_multiplier: 5
  fee_recovery_rate: 0.8

metrics:
  output_csv: results/miner_self_dealing.csv
