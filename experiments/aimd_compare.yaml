name: aimd_compare

num_blocks: 500
random_seed: 42

chain:
  block_action_cap: 200
  block_byte_cap: 2000000

zip317:
  marginal_fee: 5000

controller:
  type: AIMDBucketController
  base_fee: 5000
  alpha: 0.25
  beta: 0.90
  target_utilization: 0.70
  lower_utilization: 0.40
  increase_window: 5
  decrease_window: 20
  block_action_cap: 200

block_builder:
  mode: highest_fee_per_action

synthetic:
  enabled: true
  actions_per_block: 100
  fee_per_action: 5000
  granularity_mode: granular
  tx_granularity_actions: 1

honest_demand:
  arrival_rate: 30
  mean_actions: 3
  expiry_blocks: 40

attacker:
  enabled: true
  type: BurstSpamAttacker
  start_height: 100
  end_height: 150
  target_fee_multiplier: 5
  actions_per_block: 300

metrics:
  output_csv: results/aimd_compare.csv
