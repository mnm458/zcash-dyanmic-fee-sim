name: burst_spam_persistence

num_blocks: 500
random_seed: 42

chain:
  block_action_cap: 1000
  block_byte_cap: 2000000

zip317:
  marginal_fee: 5000

controller:
  type: ComparableMedianController
  lookback: 50
  reorg_buffer: 5
  oracle: median_of_medians
  oracle_include_synthetic: true
  quantization: round10
  base_fee: 5000
  floor_fee: 5000

block_builder:
  mode: zip317_weighted_random

synthetic:
  enabled: true
  actions_per_block: 100
  fee_per_action: 5000
  granularity_mode: granular
  tx_granularity_actions: 1

honest_demand:
  arrival_rate: 30
  mean_actions: 3
  expiry_blocks: 40

attacker:
  enabled: true
  type: BurstSpamAttacker
  start_height: 100
  end_height: 110
  target_fee_multiplier: 10
  actions_per_block: 500

metrics:
  output_csv: results/burst_spam_persistence.csv
