name: hysteresis_compare

num_blocks: 500
random_seed: 42

chain:
  block_action_cap: 1000
  block_byte_cap: 2000000

zip317:
  marginal_fee: 5000

controller:
  type: ComparableMedianHysteresisController
  lookback: 50
  reorg_buffer: 5
  oracle: action_weighted_median
  oracle_include_synthetic: true
  base_fee: 5000
  floor_fee: 5000
  move_up_ratio: 0.8
  move_down_ratio: 0.2
  move_up_consecutive: 5
  move_down_consecutive: 20

block_builder:
  mode: highest_fee_per_action

synthetic:
  enabled: true
  actions_per_block: 100
  fee_per_action: 5000
  granularity_mode: granular
  tx_granularity_actions: 1

honest_demand:
  arrival_rate: 30
  mean_actions: 3
  expiry_blocks: 40

attacker:
  enabled: true
  type: BucketBoundaryNudgingAttacker
  start_height: 100
  end_height: 400
  nudge_actions: 50
  nudge_fee_multiplier: 1.5

metrics:
  output_csv: results/hysteresis_compare.csv
